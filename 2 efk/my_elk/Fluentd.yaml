# 1. 正则命名捕获：从纯文本抠字段
# 典型场景：日志行是纯文本，需要把里面的 address 这类字段提出来变成 JSON key。

# 输入日志：

# text
# 2024-12-18 10:15:30 ERROR [Auth] Login failed for user 'jdoe' at address 192.168.1.1
# Fluentd 配置（用 filter + regexp 解析器）：

<filter **>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type regexp
    expression /(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+(?<level>[A-Z]+)\s+\[(?<module>[^\]]+)\]\s+(?<detail>.*) at address (?<address>\d{1,3}(?:\.\d{1,3}){3})/
  </parse>
</filter>


输出结果address 已经变成独立字段）：
# json
# {
#   "message": "原始日志……",
#   "timestamp": "2024-12-18 10:15:30",
#   "level": "ERROR",
#   "module": "Auth",
#   "detail": "Login failed for user 'jdoe'",
#   "address": "192.168.1.1"
# }
# 关键就是正则里的 (?<address>...)：命名捕获组直接变成 JSON 的 key，Fluentd 的 regexp 解析器就是靠这个把文本转成结构化字段的。