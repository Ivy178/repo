# high-cpu-alert
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: node-alerts
      interval: 30s
      rules:
        # 规则1: CPU使用率过高
        - alert: NodeCPUHigh
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "节点 {{ value }}%"
        # 规则2: 服务器宕机告警
        -alert:ServerStatus
          expr:up==0# up=0表示目标不可达
          for:10s       # 持续10秒才触发
          labels:
            severity:critical# 严重级别：严重
          annotations:
            summary:"实例 {{ $labels.instance }} 关闭"
            description:"系统 {{ $labels.instance }}: 实例关闭"
            ip:"{{ $labels.ip }}"
            
        # 规则3: 内存使用率过高
        -alert:MemoryUsage
          expr:100-round(node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes*100)>95
          for:1m
          labels:
            severity:error
          annotations:
            summary:"实例 {{ $labels.instance }} 内存使用率过高"
            description:"实例内存使用率超过 95% (当前值为: {{ $value }}%)"
            ip:"{{ $labels.ip }}"

# 同组
    - name: pod-alerts
      rules:
        # 规则5: Pod 重启频繁
        - alert: PodRestart
          expr: increase(kube_pod_container_status_restarts_total[5m]) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} restarted frequently"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} restarted more than 3 times in 5 minutes."


  groups:
    - name: redis-alerts
      rules:
        - alert: RedisDown
          expr: up{job="redis_exporter"} == 0
          for: 1m
          labels:
            severity: P1
          annotations:
            summary: "Redis Exporter 抓取失败"

        - alert: RedisMemoryHigh
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
          for: 5m
          labels:
            severity: P2
          annotations:
            summary: "Redis 内存使用率超过 80%"