# 全局配置
global:
scrape_interval:15s      # 每15秒抓取一次指标
evaluation_interval:15s# 每15秒评估一次告警规则

# Alertmanager 配置
alerting:
alertmanagers:
    -static_configs:
        -targets:
           -192.168.67.111:9093# Alertmanager地址

# 告警规则文件
rule_files:
-"/opt/bitnami/prometheus/rules/*rule.yml"

# 抓取目标配置
scrape_configs:
# 监控Prometheus自身
-job_name:"prometheus"
    static_configs:
      -targets:["192.168.67.111:9090"]

# 监控节点（可添加多个节点）
-job_name:"node-exporter"
    static_configs:
      -targets:
          -"192.168.67.111:9100"
          -"192.168.67.112:9100"# 第二台服务器
          -"192.168.67.113:9100"# 第三台服务器

-job_name: 'redis_exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          env: 'prod'
          service: 'redis'