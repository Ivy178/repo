apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
data:
  # 简单键值对：类属性
  player_initial_lives: "3"
  ui_properties_file_name: "user-interface.properties"
  # 类文件内容：整段文本作为一个值
  game.properties: |
    enemy.types=aliens,monsters
    player.maximum-lives=5
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
spec:
  containers:
    - name: demo
      image: alpine
      command: ["/bin/sh", "-c", "cat /etc/config/game.properties; sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config      # 挂载到容器的这个目录
  volumes:
    - name: config-volume
      configMap:
        name: game-demo               # 引用哪个 ConfigMap