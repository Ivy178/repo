apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  labels:
    app: demo
spec:
  # nodeSelector:最硬、最简单的节点标签匹配
  nodeSelector:
    disktype: ssd                      # 节点必须有 disktype=ssd 这个标签

  # nodeAffinity:比 nodeSelector 更灵活,支持操作符和软硬约束
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:   # 硬约束:必须满足
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["zone-a", "zone-b"]            # 只能调度到 zone-a 或 zone-b
      preferredDuringSchedulingIgnoredDuringExecution:  # 软约束:优先满足,不满足也能跑
        - weight: 80
          preference:
            matchExpressions:
              - key: gpu
                operator: In
                values: ["true"]                        # 优先有 GPU 的节点

    # Pod 反亲和:尽量别和同 app 的 Pod 挤在同一节点
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["demo"]                      # 已有 app=demo 的 Pod 所在节点,尽量避开
            topologyKey: kubernetes.io/hostname         # 以“节点”为拓扑粒度

  # Toleration:容忍节点上的污点,否则带污点的节点调度不上去
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "demo"
      effect: "NoSchedule"                             # 对应节点上的 dedicated=demo:NoSchedule 污点

  containers:
    - name: app
      image: nginx:alpine



# nodeSelector:最直接的“节点必须有这个标签”,只支持等值匹配,满足不了就不调度。
# nodeAffinity 的 required:硬约束,但支持 In、NotIn、Exists 等操作符,比 nodeSelector 表达力强。
# nodeAffinity 的 preferred:软约束,按 weight 打分,调度器尽量满足,不满足也能运行。
# podAntiAffinity:让 Pod 尽量别和同类 Pod 落在同一个 topologyKey 下。这里用 kubernetes.io/hostname 表示“按节点打散”,换成 topology.kubernetes.io/zone 就是“按可用区打散”。
# tolerations:Pod 侧声明“我能接受哪种污点”。节点上如果打了 dedicated=demo:NoSchedule,只有带这条 toleration 的 Pod 才能上去。


## 三个坑
# Toleration 只是“允许”,不是“吸引”。Pod 能容忍污点,不代表一定会去那个节点；要确保它真的去,还得靠 nodeSelector 或 nodeAffinity 把它“拉”过去。只写 toleration 不写亲和,调度器可能还是选别的节点。
# nodeSelector 和 nodeAffinity.required 是“与”关系,两者必须同时满足。如果标签设计冲突,Pod 会一直 Pending。
# podAntiAffinity 用 preferred 更安全。如果写成 requiredDuringScheduling,当节点数不够打散时,Pod 会直接调度失败卡住；生产上通常用 preferred + 足够副本数来兼顾可用性。