apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rabbitmq.fullname" . }}-init
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  rabbitmq-init.sh: |-
    echo "----------------------------------------------------------------------"
    echo "Starting init script for rabbitmq"
    echo "----------------------------------------------------------------------"

    NODE_WORK="-1 --node rabbit@{{ include "rabbitmq.fullname" . }}-0.{{ include "rabbitmq.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
    NODE_LAST="-1 --node rabbit@{{ include "rabbitmq.fullname" . }}-{{ sub .Values.replicaCount 1 }}.{{ include "rabbitmq.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
    # FILTER="tr '\t' ' ' | tr -s ' '"

    # Find right instance type: rabbitmq or rabbitmq-ds
    RABBITMQ_TYPE={{ include "rabbitmq.fullname" . | replace "-" "" | upper }}
    install -m 400 /secrets/${RABBITMQ_TYPE}_ERLANG_COOKIE /var/lib/rabbitmq/.erlang.cookie

    echo "Parameters:"
    echo "- rabbitmqctl (last node in cluster): $NODE_LAST"
    echo "- rabbitmqctl (all request will be send here): $NODE_WORK"
    echo "- erlang cookie: `cat /var/lib/rabbitmq/.erlang.cookie`"
    echo "- expected number of nodes: {{ .Values.replicaCount }}"

    echo "----------------------------------------------------------------------"

    echo "Waiting for all nodes in cluster to start"
    until echo "ping! pong!" && rabbitmqctl status $NODE_LAST 1>/dev/null 2>/dev/null; do sleep 20; done;

    echo "Expected number of nodes is now available"

    echo "----------------------------------------------------------------------"

    echo "Creating vhosts (if they are not existing)"
    {{- printf "\n" }}
    {{- range .Values.configurationInitial.vhosts }}
    if [ `rabbitmqctl $NODE_WORK list_vhosts -s | grep -E "^{{ . }}$" | wc -l` -eq 0 ]; then
      rabbitmqctl $NODE_WORK add_vhost -s {{ . }} && echo "- vhost '{{ . }}' added"
    else
      echo "- vhost '{{ . }}' exists"
    fi;
    {{- end }}

    echo "Creating users (if they are not existing)"
    {{- printf "\n" }}
    {{- range .Values.configurationInitial.users }}
    if [ `rabbitmqctl $NODE_WORK list_users -s | grep -E "^{{ .username }}$" | wc -l` -eq 0 ]; then
      rabbitmqctl $NODE_WORK add_user -s {{ .username }} $(cat /secrets/${RABBITMQ_TYPE}_{{ .username | upper }}_PASSWORD) && echo "- user '{{ .username }}' added"
    else
      echo "- user '{{ .username }}' exists"
    fi;
    {{- end }}

    echo "Changing password for users (forced for every user)"
    {{- printf "\n" }}
    {{- range .Values.configurationInitial.users }}
    rabbitmqctl $NODE_WORK change_password -s {{ .username }} $(cat /secrets/${RABBITMQ_TYPE}_{{ .username | upper }}_PASSWORD) && echo "- password for user '{{ .username }}' set"
    {{- end }}

    echo "Setting tags to users (if they are not existing)"
    {{- printf "\n" }}
    {{- range .Values.configurationInitial.users }}
    if [ `rabbitmqctl $NODE_WORK list_users -s | grep -E "^{{ .username }}[^\[]+\[{{ join "," .tags }}]$" | wc -l` -eq 0 ]; then
      rabbitmqctl $NODE_WORK set_user_tags -s {{ .username }} {{ join " " .tags }} && echo "- user '{{ .username }}' received tags '{{ join "," .tags }}'"
    else
      echo "- user '{{ .username }}' already has tags '{{ join "," .tags }}'"
    fi;
    {{- end }}

    echo "Setting permission to users (if they are not existing)"
    {{- printf "\n" }}
    {{- range .Values.configurationInitial.users }}
    {{- $user := . -}}
    {{- range .permissions }}
    if [ `rabbitmqctl $NODE_WORK list_permissions -s -p {{ .vhost }} | grep -E "^{{ $user.username }}\b" | wc -l` -eq 0 ]; then
      rabbitmqctl $NODE_WORK set_permissions -s -p {{ .vhost }} {{ $user.username }} '{{ .configure | quote }}' '{{ .write | quote }}' '{{ .read | quote }}' && echo "- user '{{ $user.username }}' in vhost '{{ .vhost }}' received permissions '{{ .configure | quote }}' '{{ .write | quote }}' '{{ .read | quote }}'"
    else
      echo "- user '{{ $user.username }}' already have some permission in vhost '{{ .vhost }}'"
    fi;
    {{- end }}
    {{- end }}

    echo "Remove user guest (if they are not existing)"
    # {{- printf "\n" }}
    if [ `rabbitmqctl $NODE_WORK list_users -s | grep -E "^guest\b" | wc -l` -ne 0 ]; then
      rabbitmqctl $NODE_WORK delete_user -s guest && echo "- user 'guest' deleted"
    else
      echo "- user 'guest' does not exists"
    fi;

    echo "Set policies (if they are not existing)"
    {{- range .Values.configurationInitial.policies }}
    if [ `rabbitmqctl $NODE_WORK list_policies -s -p {{ .vhost }} | grep -E "\b{{ .name }}\b" | wc -l` -eq 0 ]; then
      rabbitmqctl $NODE_WORK set_policy {{ .name }} "{{ .pattern }}" '{{ .tags | toJson }}' --apply-to {{ .apply_to }} --vhost {{ .vhost }} -s && echo "- policy '{{ .name }}' added to vhost '{{ .vhost }}'"
    else
      echo "- policy '{{ .name }}' in vhost '{{ .vhost }}' already exists"
    fi;
    {{- end }}

    echo "----------------------------------------------------------------------"
    echo "Current status on cluster"
    echo "----------------------------------------------------------------------"

    rabbitmqctl $NODE_WORK list_users

    {{- range .Values.configurationInitial.vhosts }}
    rabbitmqctl $NODE_WORK list_permissions -p {{ . }}
    {{- end }}

    echo "----------------------------------------------------------------------"
    echo "End of work"
    echo "----------------------------------------------------------------------"