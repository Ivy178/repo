xml
  
<source>
  @type tail
  format none
  path /var/log/rabbitmq/rabbit@@server_name@@.log
  pos_file /var/lib/google-fluentd/pos/rabbit@@server_name@@.pos
  read_from_head true
  # The Log tag for this Log input.
  tag @@server_name@@
</source>

<source>
  @type tail
  format none
  path /etc/rabbitmq/sa_key_detail.log
  pos_file /var/lib/google-fluentd/pos/sa_key_detail.pos
  read_from_head true
  # The Log tag for this Log input.
  tag ServiceAccountLogs
</source>