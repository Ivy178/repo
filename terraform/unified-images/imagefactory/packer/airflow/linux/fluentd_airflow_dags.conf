plaintext
  
<source>
  @type tail
  format multiline
  format_firstline /\[\d+-\d+-\d+T\d+:\d+:\d+\.\d+\]/
  format1 /(?<time>[\.]+)\s+(?<severity>\w+)[-\s]+(?<message>.*)/
  multiline_flush_interval 2s
  path /opt/airflow/logs/dags/*/*.log
  pos_file /var/lib/google-fluentd/pos/airflow_dags.pos
  read_from_head true
  tag __airflow_dags.*
</source>
<filter __airflow_dags.**>
  @type record_transformer
  <record>
    dag_name ${tag_parts[5]}
  </record>
</filter>
<match __airflow_dags.**>
  @type rewrite_tag_filter
  <rule>
    key message
    pattern /^(.+)/
    tag airflow-dags
  </rule>
</match>