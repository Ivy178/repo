<source>
    @type tail
    format none
    path /usr/local/nginx/logs/error.log
    pos_file /var/lib/google-fluentd/pos/nginx_error.pos
    read_from_head true
    # The log tag for this log input.
    tag nginx_error_@server_name@
</source>
