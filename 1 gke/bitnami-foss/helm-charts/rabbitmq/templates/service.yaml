apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.service.ports.amqp }}
      protocol: TCP
      targetPort: amqp
    - name: dist
      port: {{ .Values.service.ports.dist }}
      protocol: TCP
      targetPort: dist
    - name: epmd
      port: {{ .Values.service.ports.epmd }}
      protocol: TCP
      targetPort: epmd
    - name: manager
      port: {{ .Values.service.ports.manager }}
      protocol: TCP
      targetPort: manager
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      protocol: TCP
      targetPort: metrics
    {{- end }}