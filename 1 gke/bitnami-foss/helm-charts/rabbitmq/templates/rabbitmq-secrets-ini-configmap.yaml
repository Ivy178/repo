apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rabbitmq.fullname" . }}-secrets-ini
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
data:
  secrets.ini: |
    [DEFAULT]
    project_id={{ .Values.secretsProject }}

    {{- with .Values.secretsMap }}
    {{- range $key, $value := . }}
      {{- printf "[%s]" $key | nindent 4 }}
      {{- printf "secret_id=%s" $key | nindent 4 }}
      {{- printf "version_id=%s" (toString $value ) | nindent 4 }}
    {{- end }}
    {{- end }}