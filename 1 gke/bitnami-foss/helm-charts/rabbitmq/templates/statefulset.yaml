apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rabbitmq.fullname" }}-headless
  podManagementPolicy: OrderedReady
  replicas: {{ .Values.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "rabbitmq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rabbitmq.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rabbitmq.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: secretmanager
          image: "{{ .Values.sm.image.registry }}/{{ .Values.sm.image.repository }}:{{ .Values.sm.image.tag }}"
          imagePullPolicy: {{ .Values.sm.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.sm.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.sm.resources | nindent 12 }}
          # Use args to avoid override command
          args:
            - -c
            - /secrets_in/secrets.ini
          volumeMounts:
            - name: secrets-ini-configmap
              mountPath: /secrets_in/
            - name: secrets-emptydir
              mountPath: /secrets/
      containers:
        - name: rabbitmq
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              if [ "$RABBITMQ_FORCE_BOOT" = "yes" ]; then
                echo "Force boot is enabled"
                /opt/rabbitmq/sbin/rabbitmqctl force_boot
              else
                echo "Force boot is disabled"
              fi
              /opt/rabbitmq/sbin/rabbitmq-plugins --quiet enable {{ range .Values.plugins }}{{ . }} {{ end }}

              # Find right instance type: rabbitmq or rabbitmq-ds
              RABBITMQ_TYPE={{ include "rabbitmq.fullname" | replace "-" "" | upper }}
              install -m 400 /secrets/${RABBITMQ_TYPE}_ERLANG_COOKIE /var/lib/rabbitmq/.erlang.cookie && /opt/rabbitmq/sbin/rabbitmq-server
          ports:
            - name: amqp
              containerPort: {{ .Values.container.ports.amqp }}
            - name: dist
              containerPort: {{ .Values.container.ports.dist }}
            - name: epmd
              containerPort: {{ .Values.container.ports.epmd }}
            - name: manager
              containerPort: {{ .Values.container.ports.manager }}
            - name: metrics
              containerPort: {{ .Values.container.ports.metrics }}
          lifecycle:
            # postStart:
            #   exec:
            #     command: ["/bin/sh", "-c", "/opt/rabbitmq/sbin/rabbitmq-plugins --quiet enable {{ range .Values.plugins }}{{ . }} {{ end }}"]
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/opt/rabbitmq/sbin/rabbitmqctl stop_app"]
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/rabbitmq/sbin/rabbitmq-diagnostics -q ping"]
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/rabbitmq/sbin/rabbitmq-diagnostics -q check_running && /opt/rabbitmq/sbin/rabbitmq-diagnostics -q check_local_alarms"]
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          env:
            - name: RABBITMQ_SECURE_PASSWORD
              value: "yes"
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_SERVICE_NAME
              value: {{ include "rabbitmq.fullname" . }}-headless
            - name: K8S_HOSTNAME_SUFFIX
              value: "$(K8S_SERVICE_NAME).$(MY_POD_NAMESPACE).svc.cluster.local"
            - name: K8S_ADDRESS_TYPE
              value: hostname
            - name: RABBITMQ_NODE_NAME
              value: "rabbit@$(MY_POD_NAME).$(K8S_SERVICE_NAME).$(MY_POD_NAMESPACE).svc.cluster.local"
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_MNESIA_DIR
              value: "/opt/rabbitmq/mnesia/$(RABBITMQ_NODE_NAME)"
            - name: RABBITMQ_LDAP_ENABLE
              value: "no"
            - name: RABBITMQ_LOAD_DEFINITIONS
              value: "no"
            - name: RABBITMQ_ULIMIT_NOFILES
              value: "65536"
            - name: RABBITMQ_FORCE_BOOT
              value: {{ ternary "yes" "no" .Values.forceBoot | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: configuration
              mountPath: /etc/rabbitmq/conf.d/
            - name: data
              mountPath: /opt/rabbitmq/mnesia
            - name: secrets-emptydir
              mountPath: /secrets/
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumes:
    - name: configuration
      secret:
        secretName: {{ include "rabbitmq.fullname" . }}-config
        defaultMode: 420
        items:
          - key: rabbitmq.conf
            path: rabbitmq.conf
    - name: secrets-ini-configmap
      configMap:
        name: {{ include "rabbitmq.fullname" . }}-secrets-ini
    - name: secrets-emptydir
      emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rabbitmq.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}