apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus.fullname" . }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "prometheus.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  ports:
    - port: {{ .Values.loadBalanceExposePort }}
      targetPort: web